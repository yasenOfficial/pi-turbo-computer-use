[package]
name = "pi-turbo-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
libc = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["xtest", "shape", "render", "randr", "damage", "shm", "xkb"] }
base64 = "0.22"
png = "0.17"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
